<!doctype html><meta charset="utf-8"><title>HHD package tests</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px}li.pass{color:#067647}li.fail{color:#b42318}</style><h1>HHD Practice Room tests</h1><ol id="out"></ol><script type="module">const out=document.querySelector('#out');const test=(n,ok,d='')=>out.insertAdjacentHTML('beforeend',`<li class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'} · ${n} ${d}</li>`);try{const q=await fetch('./questions.json').then(r=>r.json());test('45 questions',q.length===45,`(${q.length})`);test('unique IDs',new Set(q.map(x=>x.id)).size===45);test('required fields',q.every(x=>x.id&&Number.isInteger(x.marks)&&x.command&&x.studyDesign&&x.question&&Array.isArray(x.markingGuide)&&x.markingGuide.length&&x.modelAnswer&&['points','holistic'].includes(x.mode)));test('three holistic responses',q.filter(x=>x.mode==='holistic').length===3);test('extended responses are eight marks',q.filter(x=>x.mode==='holistic').every(x=>x.marks===8));test('Kids Helpline question retained',q.some(x=>x.id==='U2A2-03'));}catch(e){test('questions load',false,e.message)}</script>
